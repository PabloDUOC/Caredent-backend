spring.application.name=caredent-backend
# Perfil activo: dev (H2, sin instalar nada) o prod (MySQL). Se cambia con SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago

# JWT (en prod el secreto es OBLIGATORIO por variable de entorno)
caredent.jwt.secret=${JWT_SECRET:caredent-secreto-solo-para-desarrollo-cambiar-0123456789}
caredent.jwt.access-minutes=${JWT_ACCESS_MINUTES:30}
caredent.jwt.refresh-days=${JWT_REFRESH_DAYS:7}

# CORS: origenes del frontend permitidos, separados por coma
caredent.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tagsSorter=alpha
