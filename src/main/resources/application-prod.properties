# Perfil prod: MySQL. Todo se configura por variables de entorno.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:caredent}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:caredent}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Sin valor por defecto: si falta JWT_SECRET la aplicacion no arranca.
caredent.jwt.secret=${JWT_SECRET}
server.forward-headers-strategy=framework
